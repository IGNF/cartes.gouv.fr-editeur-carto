name: Preview PR

on:
    pull_request:
        types: [opened, reopened, synchronize, closed]

jobs:
    preview:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use nodejs
              if: github.event.action != 'closed'
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"

            - name: Install dependencies
              if: github.event.action != 'closed'
              run: npm install

            - name: Build
              if: github.event.action != 'closed'
              env:
                  BASE_URL: /cartes.gouv.fr-editeur-carto/pr-preview/pr-${{ github.event.number }}
              run: VITE_OIDC_USE_MOCK=true API_URL=${{ vars.API_URL }} npx vite build --mode demo

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@v1
              with:
                  source-dir: ./dist
                  wait-for-pages-deployment: true
                  preview-branch: gh-pages
                  umbrella-dir: pr-preview
