        <button

            data-i18n-aria-label="controls:ui.moveSymbolDown"

            class="fr-icon-arrow-down-line fr-icon--sm"

        <button
            data-direction="up"
            id="style__drag-btn-up-ID"
            data-i18n-aria-label="controls:ui.moveSymbolUp"
            data-i18n-title="controls:ui.moveSymbolUp"
            class="fr-icon-arrow-up-line fr-icon--sm"

    <button

    <button
