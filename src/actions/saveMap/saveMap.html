<fieldset class="fr-fieldset" id="form-save-map" aria-labelledby="form-save-map__messages">
    <div class="fr-fieldset__element">
        <div class="fr-input-group">
            <label class="fr-label" for="save-name" data-i18n="actions:save-map.nameLabel"></label>
            <input class="fr-input" aria-describedby="save-name__messages" name="name" id="save-name" data-field="title" type="text" />
            <div class="fr-messages-group" id="save-name__messages" aria-live="polite"></div>
        </div>
    </div>
    <div class="fr-fieldset__element">
        <div class="fr-select-group">
            <label for="save-theme" class="fr-label" data-i18n="actions:save-map.themeLabel"></label>
            <select class="fr-select" id="save-theme" name="theme" aria-describedby="save-theme__messages" data-field="theme">
                <option value="" selected disabled hidden data-i18n="actions:save-map.selectTheme"></option>
            </select>
            <div class="fr-messages-group" id="save-theme__messages" aria-live="polite"></div>
        </div>
    </div>
    <div class="fr-fieldset__element">
        <div class="fr-input-group">
            <label for="save-description" class="fr-label" data-i18n="actions:save-map.descriptionLabel"></label>
            <textarea class="fr-input" id="save-description" name="description" aria-describedby="save-description__messages" data-field="description">
            </textarea>
            <div class="fr-messages-group" id="save-description__messages" aria-live="polite"></div>
        </div>
    </div>
    <div class="fr-messages-group" id="form-save-map__messages" aria-live="polite"></div>
</fieldset>
