<div>
  <form>
    <div class="fr-upload-group">
      <label class="fr-label" for="upload-file"> 
        <span data-i18n="actions:import-local.fileLabel"></span>
        <span class="fr-hint-text" data-i18n="actions:import-local.formatsHint"></span>
      </label>
      <input class="fr-upload" aria-describedby="upload-file-messages" type="file" id="upload-file" name="file">
      <div class="fr-messages-group" id="upload-file-messages" aria-live="polite">
      </div>
    </div>
    <div class="fr-mt-2w">
      <button type="submit" class="fr-btn" data-action="import-file" data-i18n="common:import"></button>
    </div>
    <div class="fr-mt-3w">
      <a data-i18n-title="actions:import-local.documentationTitle" data-documentation="import-data" href="#" target="_blank"
        rel="noopener external" class="fr-link fr-link--sm" data-i18n="actions:import-local.documentation"></a>
    </div>
  </form>
</div>
