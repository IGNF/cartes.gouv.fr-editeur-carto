    /api/users:
        get:
            tags:
                - User
            description: "Recherche d'utilisateurs par autocompletion"
            operationId: getUsers
            parameters:
                - name: query
                  in: query
                  description: "public_name contient query"
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: "Liste des utilisateurs correspondants"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    properties:
                                        {
                                            public_name: { type: string, example: my_public_name },
                                            public_id: { type: string, example: 1aBc },
                                            profile_picture: { type: string, format: uri },
                                        }
                                    type: object
                "400":
                    $ref: "#/components/responses/BadRequest"
components:
    schemas:
        Article:
            properties:
                id:
                    description: "Identifiant de l'article"
                    type: integer
                category:
                    description: "Catégorie de l'article"
                    type: string
                position:
                    description: "Ordre d'affichage de l'article"
                    type: number
                title:
                    description: "Titre de l'article"
                    type: string
                content:
                    description: "Contenu de l'article"
                    type: string
                tags:
                    description: "Tags de l'article"
                    type: array
                    items:
                        type: string
                updated_at:
                    description: "Date de mise à jour de l'article"
                    type: string
                    format: date-time
                updated_by:
                    description: "Nom public de l'utilisateur qui a modifié l'article"
                    type: string
                img_url:
                    description: "Url de l'image d'illustration de l'article"
                    type: string
                    format: uri
                link_text:
                    description: "Article de la catégorie news : texte du lien"
                    type: string
                link_url:
                    description: "Article de la catégorie news : destination du lien"
                    type: string
                    format: uri
            type: object
        Bbox:
            description: "Emprise visible de la carte (haut, droite, bas, gauche)"
            type: array
            items:
                type: number
            maxItems: 4
            minItems: 4
        Map_add:
            description: "Objet carte à envoyer lors d'ajout / modification d'une carte"
            required:
                - title
                - theme_id
                - type
                - premium
                - active
                - bbox
            properties:
                title:
                    description: "Titre de la carte"
                    type: string
                description:
                    description: "Description de la carte"
                    type: string
                    nullable: true
                theme_id:
                    description: "identifiant du theme"
                    type: integer
                type:
                    description: "Type de la carte ('macarte', 'mesadresses', statistic', storymap')"
                    type: string
                premium:
                    description: "Premium de la carte ('default', 'edugeo')"
                    type: string
                organization_id:
                    description: "Identifiant public de l'organisation."
                    type: string
                active:
                    description: "Carte active (par ex : terminée ou non)"
                    type: boolean
                share:
                    description: "Publication de la carte ('atlas', 'public', 'private').\nSi 'organization' est rempli, la valeur sera 'private' sauf si l'utilisateur connecté est owner"
                    type: string
                    default: public
                bbox:
                    $ref: "#/components/schemas/Bbox"
                img_url:
                    description: "Url de l'image illustrant la carte. Peut être une chaîne vide."
                    type: string
                    nullable: true
                creator_id:
                    description: "Identifiant public du créateur (si la carte est dans une organisation)"
                    type: string
            type: object
        Map_list:
            description: "Description d'une carte avec ses métadonnées"
            required:
                - title
                - title_url
                - description
                - theme
                - theme_id
                - organization
                - organization_id
                - organization_name
                - type
                - premium
                - active
                - valid
                - created_at
                - updated_at
                - nb_view
                - img_url
                - share
                - bbox
                - user
                - user_id
                - author
                - author_id
                - view_id
                - view_url
            properties:
                title:
                    description: "Titre de la carte"
                    type: string
                title_url:
                    description: "Titre de la carte, adapté pour etre utilisé dans les url"
                    type: string
                description:
                    description: "Description de la carte"
                    type: string
                    nullable: true
                theme:
                    description: "Thème lié à la carte"
                    type: string
                    nullable: true
                theme_id:
                    description: "Id du thème"
                    type: integer
                    nullable: true
                organization:
                    description: "Nom de l'organisation"
                    type: string
                    nullable: true
                organization_id:
                    description: "Identifiant de l'organisation"
                    type: string
                organization_name:
                    description: "Nom de l'organisation"
                    type: string
                type:
                    description: "Type de la carte ('macarte', 'mesadresses', statistic', storymap')"
                    type: string
                premium:
                    description: "Premium de la carte ('default', 'edugeo')"
                    type: string
                active:
                    description: "Carte active"
                    type: boolean
                valid:
                    description: "Carte valide"
                    type: boolean
                created_at:
                    description: "Date de création de la carte"
                    type: string
                    format: date-time
                updated_at:
                    description: "Dernière date de mise à jour de la carte"
                    type: string
                    format: date-time
                nb_view:
                    description: "Nombre total de vues"
                    type: integer
                img_url:
                    description: "URI de l'image. Peut être une chaîne vide."
                    type: string
                    nullable: true
                share:
                    description: "Publication de la carte ('atlas', 'public', 'private')"
                    type: string
                bbox:
                    $ref: "#/components/schemas/Bbox"
                view_id:
                    description: "Id utilisé pour la visualisation"
                    type: string
                view_url:
                    description: "Lien vers la visualisation de la carte"
                    type: string
                    format: uri
                edit_id:
                    description: "Id utilisé pour l'édition, renvoyé uniquement si l'utilisateur peut éditer la carte"
                    type: string
                    nullable: true
                user:
                    description: "Nom public du dernier éditeur de la carte"
                    type: string
                user_id:
                    description: "Identifiant public du dernier éditeur de la carte"
                    type: string
                author:
                    description: "Nom public de l'auteur de la carte"
                    type: string
                author_id:
                    description: "Identifiant public de l'auteur de la carte"
                    type: string
            type: object
        Map_view:
            description: "Description d'une carte avec ses métadonnées et les liens de modification / visualisation"
            allOf:
                - $ref: "#/components/schemas/Map_list"
                - required:
                      - data_url
                  properties:
                      data_url:
                          description: "lien vers le contenu de la carte"
                          type: string
                          format: uri
                      data_edit_url:
                          description: "lien vers l'édition du contenu de la carte, renvoyé uniquement si l'utilisateur peut éditer la carte"
                          type: string
                          format: uri
                          nullable: true
                      editor:
                          description: "utilisateur qui a modifié le contenu, renvoyé uniquement si l'utilisateur peut éditer la carte"
                          type: string
                          nullable: true
                  type: object
        Media:
            description: media
            properties:
                id:
                    description: "identifiant du media"
                    type: integer
                name:
                    description: "nom de l'image originale"
                    type: string
                fileName:
                    description: "nom du fichier enregistré"
                    type: string
                owner:
                    description: "username de l'utilisateur qui a chargé le media"
                    type: string
                organization_id:
                    description: "id de l'organisation à qui appartient le media"
                    type: string
                organization:
                    description: "nom de l'organisation à qui appartient le media"
                    type: string
                uploaded_at:
                    description: "date du chargement de l'image"
                    type: string
                    format: date-time
                size:
                    description: "Taille de l'image (en octet)"
                    type: integer
                folder:
                    description: "Nom du fichier contenant le media"
                    type: string
                valid:
                    description: "Validité de l'image"
                    type: boolean
                view_url:
                    description: "Url de l'image"
                    type: string
                    format: uri
                thumb_url:
                    description: "Url de la vignette de l'image"
                    type: string
                    format: uri
            type: object
        Media_list:
            description: "Liste de médias"
            properties:
                medias:
                    type: array
                    items:
                        $ref: "#/components/schemas/Media"
                count:
                    description: "Nombre de média correspondant à la recherche"
                    type: integer
                limit:
                    description: "Nombre de média recues dans la requete"
                    type: integer
                offset:
                    description: "Nombre de média à passer avant de ls inclure dans la requete"
                    type: integer
            type: object
        Notification:
            description: Notifications
            properties:
                id:
                    type: integer
                description:
                    type: string
                scope:
                    description: "Applicatifs où afficher la notification"
                    type: string
                showFrom:
                    type: string
                    format: date-time
                showUntil:
                    type: string
                    format: date-time
                repeatibility:
                    description: "Nombre de fois à afficher la notification"
                    type: integer
            type: object
        Organization:
            properties:
                public_id:
                    description: "Identifiant de l'organisation"
                    type: string
                name:
                    description: "Nom de l'organisation"
                    type: string
                presentation:
                    description: "Présentation / Description de l'organisation"
                    type: string
                    nullable: true
                profile_picture:
                    description: "URL de l'image / logo de l'organisation"
                    type: string
                    format: uri
                    nullable: true
                cover_picture:
                    description: "URL de l'image / logo de couverture de l'organisation"
                    type: string
                    format: uri
                    nullable: true
                created_at:
                    description: "Date de création de l'organisation"
                    type: string
                    format: date-time
                updated_at:
                    description: "Date de modification de l'organisation"
                    type: string
                    format: date-time
                premium:
                    description: "Premium l'organisation parmi [null, 'edugeo']"
                    type: string
                    nullable: true
                nb_members:
                    description: "Nombre de membres dans l'organisation"
                    type: integer
                nb_shared_maps:
                    description: "Nombre de cartes de l'organisation partagées dans l'atlas"
                    type: integer
                nb_views:
                    description: "Nombre de vues sur l'ensemble des cartes de l'organisation"
                    type: integer
                locked:
                    description: "L'organisation est bloquée par un admin"
                    type: boolean
                media_size_limit:
                    description: "Taille globale autorisée pour les images de l'organisation (en octets)"
                    type: integer
                medias_size:
                    description: "Taille globale des images de l'organisation (en octets)"
                    type: integer
                members:
                    description: "Membres de l'organisation"
                    type: array
                    items:
                        properties:
                            public_name:
                                description: "Nom public de l'utilisateur"
                                type: string
                            public_id:
                                description: "Identifiant public de l'utilisateur"
                                type: string
                            registered_at:
                                description: "Date où l'utilisateur a été ajouté"
                                type: string
                                format: date-time
                            role:
                                description: "Role de l'utilisateur dans l'organisation ('member'|'editor'|'owner')"
                                type: string
                            promoted_at:
                                description: "Date où l'utilisateur a été promu"
                                type: string
                                format: date-time
                            active:
                                description: "L'utilisateur est actif dans l'organisation"
                                type: boolean
                            profile_picture:
                                description: "Url de l'image de profil"
                                type: string
                                format: uri
                        type: object
            type: object
        MapResearchItem:
            description: "Carte renvoyée dans les résultats de recherche. Cet objet est construit depuis une requête SQL, et non directement depuis le normalizer d'entité Map."
            required:
                - type
                - title
                - description
                - updated_at
                - nb_view
                - img_url
                - organization_id
                - organization_name
                - user
                - user_id
                - theme
                - theme_id
                - share
                - premium
                - valid
                - active
                - title_url
                - view_id
                - view_url
                - bbox
            properties:
                type:
                    description: "Type de la carte ('macarte', 'storymap')"
                    type: string
                title:
                    description: "Titre de la carte"
                    type: string
                description:
                    description: "Description de la carte"
                    type: string
                    nullable: true
                updated_at:
                    description: "Dernière date de mise à jour de la carte"
                    type: string
                    format: date-time
                nb_view:
                    description: "Nombre total de vues"
                    type: integer
                img_url:
                    description: "URL de l'image illustrant la carte. Peut être une chaîne vide."
                    type: string
                    nullable: true
                organization_id:
                    description: "Identifiant public de l'organisation"
                    type: string
                    nullable: true
                organization_name:
                    description: "Nom de l'organisation"
                    type: string
                    nullable: true
                user:
                    description: "Nom public de l'auteur de la carte"
                    type: string
                user_id:
                    description: "Identifiant public de l'auteur de la carte"
                    type: string
                theme:
                    description: "Thème lié à la carte"
                    type: string
                    nullable: true
                theme_id:
                    description: "Id du thème"
                    type: integer
                    nullable: true
                share:
                    description: "Publication de la carte ('atlas', 'public', 'private')"
                    type: string
                premium:
                    description: "Premium de la carte ('default', 'edugeo')"
                    type: string
                    nullable: true
                valid:
                    description: "Carte valide"
                    type: boolean
                active:
                    description: "Carte active"
                    type: boolean
                title_url:
                    description: "Titre de la carte, adapté pour être utilisé dans les URLs"
                    type: string
                view_id:
                    description: "Id utilisé pour la visualisation"
                    type: string
                view_url:
                    description: "Lien vers la visualisation de la carte"
                    type: string
                    format: uri
                bbox:
                    $ref: "#/components/schemas/Bbox"
                edit_id:
                    description: "Id utilisé pour l'édition, renvoyé uniquement en contexte profile"
                    type: string
                    nullable: true
                edit_url:
                    description: "Lien vers l'édition de la carte, renvoyé uniquement en contexte profile"
                    type: string
                    format: uri
                    nullable: true
            type: object
        MapResearchTheme:
            description: "Agrégat du nombre de cartes par thème dans les résultats de recherche"
            required:
                - theme
                - count
            properties:
                theme:
                    description: "Nom du thème, ou 'undefined' pour les cartes sans thème"
                    type: string
                count:
                    description: "Nombre de cartes"
                    type: integer
            type: object
        MapResearchOrganization:
            description: "Agrégat du nombre de cartes par organisation dans les résultats de recherche"
            required:
                - organization
                - public_id
                - count
            properties:
                organization:
                    description: "Nom de l'organisation, ou chaîne vide pour les cartes hors organisation"
                    type: string
                public_id:
                    description: "Identifiant public de l'organisation, ou chaîne vide pour les cartes hors organisation"
                    type: string
                count:
                    description: "Nombre de cartes"
                    type: integer
            type: object
        Map_research:
            description: "Recherche des cartes"
            required:
                - maps
                - themes
                - organizations
                - users
                - types
                - premiums
                - actives
                - valides
                - shares
                - query
                - count
                - limit
                - offset
            properties:
                maps:
                    type: array
                    items:
                        $ref: "#/components/schemas/MapResearchItem"
                themes:
                    type: array
                    items:
                        $ref: "#/components/schemas/MapResearchTheme"
                organizations:
                    type: array
                    items:
                        $ref: "#/components/schemas/MapResearchOrganization"
                users:
                    type: array
                    items:
                        required:
                            - user
                            - count
                        properties:
                            user:
                                description: "Nom public de l'utilisateur"
                                type: string
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                types:
                    type: array
                    items:
                        required:
                            - type
                            - count
                        properties:
                            type:
                                description: "Nom du type"
                                type: string
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                premiums:
                    type: array
                    items:
                        required:
                            - premium
                            - count
                        properties:
                            premium:
                                description: "Nom du premium"
                                type: string
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                actives:
                    type: array
                    items:
                        required:
                            - active
                            - count
                        properties:
                            active:
                                description: "booléen indiquant active/inactive"
                                type: boolean
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                valides:
                    type: array
                    items:
                        required:
                            - valid
                            - count
                        properties:
                            valid:
                                description: "booléen indiquant valide/invalide"
                                type: boolean
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                shares:
                    type: array
                    items:
                        required:
                            - share
                            - count
                        properties:
                            share:
                                description: "Publication de la carte"
                                type: string
                            count:
                                description: "Nombre de cartes"
                                type: integer
                        type: object
                query:
                    description: "Mot(s) contenu(s) dans le titre, la description ou le theme des cartes"
                    type: string
                count:
                    description: "Nombre de cartes correspondant à la recherche"
                    type: integer
                limit:
                    description: "Nombre de cartes reçues dans la requête. Peut être null lorsque toutes les cartes sont demandées."
                    type: integer
                    nullable: true
                offset:
                    description: "Nombre de cartes à passer avant de les inclure dans la requete"
                    type: integer
            type: object
        Theme:
            description: Theme
            properties:
                id:
                    description: "Id du thème"
                    type: integer
                name:
                    description: "Nom complet du thème"
                    type: string
            type: object
        Login:
            properties:
                token:
                    description: "Jeton JWT à envoyer dans le header Authorization: Bearer xxx"
                    type: string
                refresh_token:
                    description: "Jeton pour rafraichir le jeton JWT à envoyer /api/token/refresh"
                    type: string
            type: object
        User_public:
            properties:
                public_id:
                    description: "identifiant public de l'utilisateur, ne sera jamais modifié"
                    type: string
                public_name:
                    description: "Unique, ne doit pas être déjà utilisé (Erreur 400)"
                    type: string
                twitter_account:
                    description: "Nom de compte Twitter"
                    type: string
                facebook_account:
                    description: "Nom de compte Facebook"
                    type: string
                linkedin_account:
                    description: "Nom de compte LinkedIn"
                    type: string
                presentation:
                    description: "Présentation publique"
                    type: string
                profile_picture:
                    description: "Url de l'image de profil"
                    type: string
                    format: uri
                cover_picture:
                    description: "Url de l'image de couverture"
                    type: string
                    format: uri
            type: object
        User_edit:
            type: object
            allOf:
                - $ref: "#/components/schemas/User_public"
                - properties:
                      email:
                          description: "Unique, ne doit pas être déjà utilisé (Erreur 400)"
                          type: string
                          format: email
                      username:
                          description: "Unique, ne doit pas être déjà utilisé (Erreur 400)"
                          type: string
                  type: object
        User_me_edit:
            type: object
            allOf:
                - $ref: "#/components/schemas/User_edit"
                - properties:
                      current_password:
                          type: string
                      new_password:
                          type: string
                  type: object
        User_view:
            type: object
            allOf:
                - $ref: "#/components/schemas/User_edit"
                - properties:
                      locked:
                          description: "Compte bloqué"
                          type: boolean
                      id:
                          type: integer
                      medias_limit_size:
                          description: "Taille globale limite des images uploadées (en octet)"
                          type: integer
                      medias_size:
                          description: "Taille globale des images uploadées (en octet)"
                          type: integer
                      roles:
                          description: "Rôle(s) de l'utilisateur"
                          type: array
                          items:
                              type: string
                  type: object
    responses:
        Already_reported:
            description: "La ressource est déjà existante"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 208
                            message:
                                type: string
                                example: "La ressource est déjà existante"
                        type: object
        Deleted:
            description: "La ressource a été supprimée"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 204
                            message:
                                type: string
                                example: "La ressource a été supprimée"
                        type: object
        BadRequest:
            description: "La requête n'est pas correcte"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 400
                            message:
                                type: string
                                example: "La requête n'est pas correcte"
                        type: object
        NotConnected:
            description: "Vous devez être connecté"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 401
                            message:
                                type: string
                                example: "Vous devez être connecté"
                        type: object
        NotFound:
            description: "La ressource n'existe pas"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 404
                            message:
                                type: string
                                example: "La ressource n'existe pas"
                        type: object
        Forbidden:
            description: "Vous n'avez pas accès à cette ressource"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 403
                            message:
                                type: string
                                example: "Vous n'avez pas accès à cette ressource"
                        type: object
        Invalid:
            description: "Vous ne pouvez pas accéder à la ressource pour des raisons légales"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 451
                            message:
                                type: string
                                example: "Vous ne pouvez pas accéder à la ressource pour des raisons légales"
                        type: object
        TooLarge:
            description: "L'objet joint est trop volumineux"
            content:
                application/json:
                    schema:
                        properties:
                            code:
                                type: integer
                                example: 413
                            message:
                                type: string
                                example: "L'objet joint est trop volumineux"
                        type: object
    parameters:
        id:
            name: id
            in: path
            description: "Identifiant de la ressource"
            required: true
            schema:
                oneOf:
                    - type: integer
                    - type: string
        view_id:
            name: view_id
            in: path
            description: "Identifiant de visualisation de la carte"
            required: true
            schema:
                oneOf:
                    - type: integer
                    - type: string
        edit_id:
            name: edit_id
            in: path
            description: "Identifiant d'édition de la carte"
            required: true
            schema:
                oneOf:
                    - type: integer
                    - type: string
        limit:
            name: limit
            in: query
            description: "Nombre maximum d'objets à retourner"
            required: false
            schema:
                type: integer
                default: 15
        offset:
            name: offset
            in: query
            description: "Le nombre d'objets à ignorer avant de commencer à collecter l'ensemble de résultats"
            required: false
            schema:
                type: integer
                default: 0
    securitySchemes:
        bearer:
            type: http
            bearerFormat: JWT
            scheme: bearer
tags:
    - name: Editorial
      description: Editorial
    - name: Map
      description: Map
    - name: User
      description: User
    - name: Media
      description: Media
    - name: Notifications
      description: Notifications
    - name: Organization
      description: Organization
    - name: Login
      description: Login
    - name: Theme
      description: Theme
