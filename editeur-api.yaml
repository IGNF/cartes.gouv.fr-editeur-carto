        get:
            tags:
                - Theme
            operationId: getThemes
            responses:
                "200":
                    description: "Liste des themes"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Theme"
    "/api/users/public/{publicId}":
        get:
            tags:
                - User
            operationId: getUserByPublicid
            parameters:
                - name: publicId
                  in: path
