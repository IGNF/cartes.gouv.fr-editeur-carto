    /api/token/refresh:
        post:
            tags:
                - Login
            operationId: refreshToken
            parameters:
                - name: refresh_token
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: "Jeton JWT et refresh"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Login"
                "401":
                    description: "An authentication exception occurred"
                    content:
                        application/json:
                            schema:
                                properties:
                                    code: { type: integer, example: 401 }
                                    message: { type: string, example: "An authentication exception occurred" }
                                type: object
    /api/login:
        post:
            tags:
                - Login
            operationId: postLogin
            parameters:
                - name: username
                  in: query
                  required: true
                  schema:
                      type: string
                - name: password
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: "Jeton Jwt et rafraichissement"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Login"
                "401":
                    description: "Erreur dans le nom d'utilisateur ou le mot de passe"
                    content:
                        application/json:
                            schema:
                                properties:
                                    code: { type: integer, example: 401 }
                                    message: { type: string, example: "Bad credentials" }
                                type: object
                "429":
                    description: "Trop de tentatives de connexion échouées"
                    content:
                        application/json:
                            schema:
                                properties:
                                    code: { type: integer, example: 429 }
                                    message: { type: string, example: "5 tentatives de connexion échouées, allez sur /debloquer-mon-compte" }
                                type: object
    /api/logout:
        post:
            tags:
                - Login
            operationId: postLogout
            responses:
                "200":
                    description: logout
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
