openapi: 3.0.0
info:
    title: "MaCarte API"
    description: "Documentation OpenAPI de l'API MaCarte"
    version: 1.0.0
servers:
    - url: "https://macarte.ign.fr/"
      description: "Accède aux données de l'environnement Ma Carte"
paths:
    /api/editorial/followers:
        get:
            tags:
                - Editorial
            operationId: getEditorialFollowers
            responses:
                "200":
                    description: "Liste des followers par réseau social"
                    content:
                        application/json:
                            schema:
                                properties:
                                    facebook: { type: string, example: 65K }
                                    twitter: { type: string, example: 13K }
                                    linkedin: { type: string, example: 24K }
                                    instagram: { type: string, example: 11K }
                                type: object
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/editorial/megamenu:
        get:
            tags:
                - Editorial
            operationId: getEditorialMegamenu
            responses:
                "200":
                    description: "Contenu html du megamenu"
                    content:
                        application/json:
                            schema:
                                properties:
                                    html: { type: string }
                                type: object
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/editorial/categories:
        get:
            tags:
                - Editorial
            operationId: getEditorialCategories
            responses:
                "200":
                    description: "Liste des categories des articles de l'editorial"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    properties:
                                        {
                                            key: { description: "clé de la catégorie", type: string },
                                            value: { description: "Nom de la catégorie", type: string },
                                        }
                                    type: object
    "/api/editorial/articles/{category}":
        get:
            tags:
                - Editorial
            operationId: getEditorialArticlesByCategory
            parameters:
                - name: category
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: "Liste des articles de la categorie"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Article"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/maps:
        get:
            tags:
                - Map
            operationId: getMaps
            parameters:
                - name: context
                  in: query
                  description: "Contexte de la recherche. Doit être parmi :\n- 'atlas' : recherche publique parmi les cartes partagées\n- 'organization' : recherche des cartes publiques & atlas de l'organisation\n- 'profile' : recherche parmi les cartes de l'utilisateur (connexion requise)\n\nUne carte partagée a share='atlas', valid=true et active=true.\n\n**Ajouter le header 'Authorization: Bearer xxx' pour le cas 'profile'.** pour ne pas avoir les erreurs 401 et 403."
                  required: false
                  schema:
                      type: string
                      default: atlas
                - name: query
                  in: query
                  description: "Un ou plusieurs mots que doivent contenir le titre, la description ou le thème. S'il y a plusieurs mots, la recherche les interprète comme un ET."
                  required: false
                  schema:
                      type: string
                - name: theme
                  in: query
                  description: "Thème des cartes <br>\n                    - nom du thème  <br>\n                    - 'undefined' pour avoir les cartes qui n'ont pas de thème <br>\n                    - null pour avoir toutes les cartes, indépendemment du thème\n                "
                  required: false
                  schema:
                      type: string
                - name: type
                  in: query
                  description: "Type des cartes ('macarte', 'storymap')"
                  required: false
                  schema:
                      type: string
                - name: premium
                  in: query
                  description: "Premium des cartes ('default', 'edugeo')"
                  required: false
                  schema:
                      type: string
                - name: organization
                  in: query
                  description: "Identifiant public de l'organisation"
                  required: false
                  schema:
                      type: string
                - name: user
                  in: query
                  description: "Nom public du créateur des cartes"
                  required: false
                  schema:
                      type: string
                - name: active
                  in: query
                  description: "Si context 'profile' : filtre les cartes actives (true) ou non-actives (false). Si context 'atlas', active=true."
                  required: false
                  schema:
                      type: boolean
                - name: valid
                  in: query
                  description: "Si context 'profile' : filtre les cartes valides (true) ou invalides (false). Si context 'atlas', valid=true."
                  required: false
                  schema:
                      type: boolean
                - name: share
                  in: query
                  description: "Si context 'profile' : filtre les cartes publiques ('atlas') ou privées ('private'). Si context 'atlas', share='atlas'."
                  required: false
                  schema:
                      type: string
                - name: sort
                  in: query
                  description: "Tri des cartes ('date', 'rank', 'views')"
                  required: false
                  schema:
                      type: string
                      default: date
                - name: limit
                  in: query
                  description: "Nombre maximum de cartes à retourner. Peut être 'all' dans le context 'profile'. Si limit > 100, limit sera considérée comme 100."
                  required: false
                  schema:
                      oneOf:
                          - type: integer
                          - type: string
                      default: 25
                - $ref: "#/components/parameters/offset"
            responses:
                "200":
                    description: "Liste des cartes recherchées selon les critères définis dans la query"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_research"
                "206":
                    description: "Contenu partiel de la liste des cartes recherchées selon les critères définis dans la query"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_research"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
        post:
            tags:
                - Map
            operationId: postMap
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            required:
                                - carte
                                - file
                            properties:
                                carte:
                                    $ref: "#/components/schemas/Map_add"
                                file:
                                    description: "Contenu de la carte au format .carte"
                                    type: string
                                    format: binary
                            type: object
            responses:
                "201":
                    description: "Attributs de la carte créée"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_view"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "404":
                    $ref: "#/components/responses/NotFound"
            security:
                - bearer: []
    /api/maps/users:
        get:
            tags:
                - Map
            description: "Autocompletion des utilisateurs ayant des cartes publiques correspondant aux critères de recherche"
            operationId: getMapsUsers
            parameters:
                - name: theme
                  in: query
                  description: "Thème des cartes (nom du thème ou 'Non défini')"
                  required: false
                  schema:
                      type: string
                - name: public_name
                  in: query
                  description: "string que le public_name des utilisateurs doit inclure"
                  required: false
                  schema:
                      type: string
                - name: query
                  in: query
                  description: "Un ou plusieurs mots que doivent contenir le titre, la description ou le thème. S'il y a plusieurs mots, la recherche les interprète comme un ET."
                  required: false
                  schema:
                      type: string
                - $ref: "#/components/parameters/limit"
            responses:
                "200":
                    description: "Liste des noms publics des utilisateurs correspondant aux critères de recherche"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                "404":
                    $ref: "#/components/responses/NotFound"
    "/api/maps/{view_id}":
        get:
            tags:
                - Map
            description: "Récupérer les metadata de la carte par son identifiant de visualisation"
            operationId: getMapByViewId
            parameters:
                - $ref: "#/components/parameters/view_id"
            responses:
                "200":
                    description: "Attributs d'une carte pour visualisation"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_view"
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
    "/api/maps/{edit_id}/edit":
        get:
            tags:
                - Map
            description: "Récupérer les metadata de la carte par son identifiant d'édition"
            operationId: getMapEditByEditId
            parameters:
                - $ref: "#/components/parameters/edit_id"
            responses:
                "200":
                    description: "Attributs d'une carte pour edition"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_view"
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
            security:
                - bearer: []
    "/api/maps/{view_id}/file":
        get:
            tags:
                - Map
            description: "Récupérer les data de la carte par son identifiant de visualisation"
            operationId: getMapFileByViewId
            parameters:
                - $ref: "#/components/parameters/view_id"
            responses:
                "200":
                    description: "Contenu d'une carte"
                    content:
                        application/json:
                            schema: {}
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
    "/api/maps/{edit_id}/edit/file":
        get:
            tags:
                - Map
            description: "Récupérer les data de la carte par son identifiant d'édition"
            operationId: getMapFileByEditId
            parameters:
                - $ref: "#/components/parameters/edit_id"
            responses:
                "200":
                    description: "Contenu d'une carte"
                    content:
                        application/json:
                            schema: {}
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
            security:
                - bearer: []
    "/api/maps/{edit_id}":
        delete:
            tags:
                - Map
            operationId: deleteMapByEditId
            parameters:
                - $ref: "#/components/parameters/edit_id"
            responses:
                "204":
                    $ref: "#/components/responses/Deleted"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
            security:
                - bearer: []
        patch:
            tags:
                - Map
            operationId: patchMapByEditId
            parameters:
                - $ref: "#/components/parameters/edit_id"
            requestBody:
                description: "Attributs de la carte, ne renseigner que les champs à modifier.\n__new_edit_id__ : boolean, si true → génère un nouvel identifiant de modification pour la carte."
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            allOf:
                                - $ref: "#/components/schemas/Map_add"
                                - properties: { new_edit_id: { description: "Demande à modifier l'id de modification", type: boolean } }
                                  type: object
            responses:
                "200":
                    description: "Attributs d'une carte pour visualisation"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Map_view"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
            security:
                - bearer: []
    "/api/maps/{edit_id}/file":
        post:
            tags:
                - Map
            operationId: postMapFileByEditId
            parameters:
                - $ref: "#/components/parameters/edit_id"
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            required:
                                - file
                            properties:
                                file:
                                    description: "Contenu de la carte au format .carte"
                                    type: string
                                    format: binary
                            type: object
            responses:
                "200":
                    description: "Contenu d'une carte"
                "404":
                    $ref: "#/components/responses/NotFound"
            security:
                - bearer: []
    /api/me:
        get:
            tags:
                - User
            operationId: getMe
            responses:
                "200":
                    description: "Attributs de l'utilisateur connecté"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User_view"
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
        delete:
            tags:
                - User
            description: "Supprime en douceur (https://phpreaction.com/support/suppression-en-douceur-soft-delete/) le compte de l'utilisateur connecté"
            operationId: deleteMe
            responses:
                "204":
                    description: "L'utilisateur a été supprimé"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "451":
                    $ref: "#/components/responses/Invalid"
            security:
                - bearer: []
        patch:
            tags:
                - User
            description: "Le paramètre **current_password** est nécessaire pour modifier les paramètres username, email et new_password\nusername, email et public_name sont uniques, la réponse 400 '... already used' peut être renvoyée"
            operationId: patchMe
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/User_me_edit"
            responses:
                "200":
                    description: "Attributs de l'utilisateur"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User_view"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
    /api/medias:
        get:
            tags:
                - Media
            description: "Renvoie les medias de l'utilisateur connecté"
            operationId: getUserMedias
            parameters:
                - name: name
                  in: query
                  description: "Name contient cette valeur"
                  required: false
                  schema:
                      type: string
                - name: id
                  in: query
                  description: "Identifiant du média recherché"
                  required: false
                  schema:
                      type: integer
                - name: organization_id
                  in: query
                  description: "Identifiant public de l'organisation, renvoie la liste de ses médias"
                  required: false
                  schema:
                      type: integer
                - name: valid
                  in: query
                  description: "Si 'true', limite la recherche aux médias invalidés par les administrateurs"
                  required: false
                  schema:
                      type: boolean
                - name: sort
                  in: query
                  description: "tri des medias, parmi ['size', 'date']"
                  required: false
                  schema:
                      type: string
                      default: date
                - $ref: "#/components/parameters/offset"
                - $ref: "#/components/parameters/limit"
            responses:
                "200":
                    description: "liste des medias"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Media_list"
                "206":
                    description: "Contenu partiel des medias"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Media_list"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
            security:
                - bearer: []
        post:
            tags:
                - Media
            description: "Ajoute un media à l'utilisateur connecté ou à l'organisation d'identifiant organization_id si renseigné"
            operationId: postMedia
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            required:
                                - file
                            properties:
                                file:
                                    description: "image à ajouter à la bibliothèque, le fichier doit faire moins de 2 Mo"
                                    type: string
                                    format: binary
                                folder:
                                    description: "Dossier où ajouter l'image"
                                    type: string
                                    default: "Non classé"
                                name:
                                    description: "Nom du fichier"
                                    type: string
                                organization_id:
                                    description: "Id de l'organization"
                                    type: string
                                    nullable: true
                            type: object
            responses:
                "201":
                    description: "Attributs du media créé"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Media"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "413":
                    $ref: "#/components/responses/TooLarge"
            security:
                - bearer: []
    /api/medias/folders:
        get:
            tags:
                - Media
            description: "Renvoie les dossiers d'images de l'utilisateur"
            operationId: getUserMediaFolders
            parameters:
                - name: organization_id
                  in: query
                  description: "Identifiant public de l'organisation. Si renseigné, renvoie les folders de l'organisation, pas de l'utilisateur connecté"
                  required: false
                  schema:
                      type: string
                      nullable: true
            responses:
                "200":
                    description: "liste des dossiers d'images"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
    "/api/image/{filename}":
        get:
            tags:
                - Media
            description: "Renvoie l'image au format binaire, l'extension n'est pas prise en compte (ex : abc1234).\nPréfixer le filename par 'thumb_' pour recevoir la miniature (200px sur la plus grande dimension)."
            operationId: getImageByFilename
            parameters:
                - name: filename
                  in: path
                  description: "Nom du fichier"
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: "Fichier binaire de l'image"
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
    "/api/medias/{id}":
        delete:
            tags:
                - Media
            description: "Supprime un media de l'utilisateur connecté. Un média non valide ne peut pas être supprimé"
            operationId: deleteMediaById
            parameters:
                - $ref: "#/components/parameters/id"
            responses:
                "204":
                    $ref: "#/components/responses/Deleted"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "451":
                    $ref: "#/components/responses/Invalid"
            security:
                - bearer: []
    "/api/medias/{id}/{attribute}":
        put:
            tags:
                - Media
            description: "Affecte value à l'attribut du media d'identifiant id (attribute dans ['folder', 'name'])"
            operationId: putMediaAttribute
            parameters:
                - $ref: "#/components/parameters/id"
                - name: attribute
                  in: path
                  description: "Attribut à modifier : doit etre parmi ['folder', 'name']"
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            properties:
                                value:
                                    description: "valeur à affecter à l'attribut [folder => peut être null]"
                                    type: string
                            type: object
            responses:
                "200":
                    description: "Attributs du media modifié"
                    content:
                        application/json:
                            schema:
                                properties:
                                    id: { description: "identifiant du média modifié", type: integer }
                                    attribute: { description: "attribut modifié", type: string }
                                    value: { description: "nouvelle valeur affectée à l'attribut", type: string }
                                type: object
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
            security:
                - bearer: []
    "/api/medias/{id}/file":
        post:
            tags:
                - Media
            description: "Modifie l'image associée au media"
            operationId: postMediaFileById
            parameters:
                - $ref: "#/components/parameters/id"
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            required:
                                - file
                            properties:
                                file:
                                    description: "image à associer à la bibliothèque, le fichier doit faire moins de 2 Mo"
                                    type: string
                                    format: binary
                            type: object
            responses:
                "200":
                    description: "Attributs du media modifié"
                    content:
                        application/json:
                            schema:
                                properties:
                                    id: { description: "identifiant du média modifié", type: integer }
                                    attribute: { description: "attribut modifié", type: string }
                                    view_url: { description: "url de l'image", type: string }
                                    thumb_url: { description: "url de la vignette", type: string }
                                type: object
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "413":
                    $ref: "#/components/responses/TooLarge"
            security:
                - bearer: []
    /api/notifications:
        get:
            tags:
                - Notifications
            operationId: getNotifications
            responses:
                "200":
                    description: "Liste des notifications actives"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Notification"
    /api/organizations/roles:
        get:
            tags:
                - Organization
            operationId: getOrganizationsRoles
            responses:
                "200":
                    description: "Liste des rôles"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    properties: { key: { description: "clé du rôle", type: string }, value: { description: "Nom du rôle", type: string } }
                                    type: object
    /api/organizations/me:
        get:
            tags:
                - Organization
            operationId: getOrganizationsMe
            responses:
                "200":
                    description: "Liste des organisations dont l'utilisateur est membre"
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    properties:
                                        {
                                            public_id: { description: "identifiant de l'organisation", type: string },
                                            name: { description: "Nom de l'organisation", type: string },
                                            profile_picture: { description: "Logo de l'organisation", type: string },
                                            cover_picture: { description: "Image de couverture", type: string },
                                            user_role: { description: "Rôle de l'utilisateur dans l'organisation", type: string },
                                            active: { description: "l'utilisateur est actif dans l'organisation", type: boolean },
                                        }
                                    type: object
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
    "/api/organizations/{id}/activate":
        get:
            tags:
                - Organization
            description: "Active l'utilisateur invité dans l'organisation"
            operationId: getOrganizationsByIdActivate
            parameters:
                - $ref: "#/components/parameters/id"
            responses:
                "200":
                    description: "Attributs de l'organisation"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Organization"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/NotConnected"
            security:
                - bearer: []
    "/api/organizations/{id}":
        get:
            tags:
                - Organization
            description: "Récupérer les données de l'organisation. NB : si pas membre, seul un décompte des membres est fourni."
            operationId: getOrganizationsById
            parameters:
                - $ref: "#/components/parameters/id"
            responses:
                "200":
                    description: "Attributs de l'organisation, les membres ne sont renvoyés que si l'utilisateur connecté fait partie de l'organisation"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Organization"
